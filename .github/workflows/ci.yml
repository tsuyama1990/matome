name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate-verification:
    name: gate-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install jtc-gov
        run: uv tool install git+https://github.com/tsuyama1990/cheeze_gyudon

      - name: Run the quality and governance gate
        env:
          GATE_BASE: origin/${{ github.base_ref }}
        run: scripts/gate.sh
